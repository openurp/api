caffeine.jcache {
  # 兜底：Hibernate 遇到映射里声明过、但这里没配置的区域，会用 MutableConfiguration 现场建缓存，
  # 而 caffeine-jcache 只在存在 default 时才给它套过期/容量策略，否则就是永不过期、也没有上限。
  # 各模块声明的实体/集合缓存区域统一为 openurp（见下面的 openurp 块）；此处兜底其余未列出的区域。
  default {
    policy {
      maximum {
        size = 10000
      }
      lazy-expiration {
        creation = 15m
        update = 15m
        access = 15m
      }
    }
  }

  openurp {
    policy {
      maximum {
        size = 10000
      }
      lazy-expiration {
        creation = 5m
        update = 5m
        access = 5m
      }
    }
  }

  default-update-timestamps-region{
    policy{
      maximum{
        size = 10000
      }
      lazy-expiration {
        creation = 15m
        update = 15m
        access = 15m
      }
    }
  }

  default-query-results-region{
    policy{
      maximum{
        size = 10000
      }
      lazy-expiration {
        creation = 15m
        update = 15m
        access = 15m
      }
    }
  }
}

logging {
  level {
    org.hibernate.orm.connections.pooling = ERROR
  }
}
